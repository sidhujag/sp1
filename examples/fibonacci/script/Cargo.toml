[package]
name = "fibonacci-script"
version = { workspace = true }
edition = { workspace = true }
default-run = "fibonacci-script"
publish = false

[dependencies]
bincode = "1.3.3"
hex = "0.4.3"
rand = "0.8.5"
sha2 = "0.10.8"
sp1-germ = { path = "../../../crates/germ" }
sp1-prover = { path = "../../../crates/prover" }
sp1-sdk = { workspace = true }
tokio = { workspace = true }
tracing = "0.1"

[build-dependencies]
sp1-build = { workspace = true }

[[bin]]
name = "plonk_bn254"
path = "bin/plonk_bn254.rs"

[[bin]]
name = "groth16_bn254"
path = "bin/groth16_bn254.rs"

[[bin]]
name = "compressed"
path = "bin/compressed.rs"

[[bin]]
name = "core_u64"
path = "bin/core_u64.rs"

[[bin]]
name = "execute"
path = "bin/execute.rs"

[[bin]]
name = "network"
path = "bin/network.rs"

[[bin]]
name = "germ_arm_bridge"
path = "bin/germ_arm_bridge.rs"

[[bin]]
name = "fibonacci-script"
path = "src/main.rs"
